id = "ykoh/amaranth-calendar"
name = "Amaranth Calendar"
version = "0.2.0"
plugin_api = 26
author = "ykoh"
license = "MIT"
icon = "calendar"
description = "아마란스 그룹웨어 일정을 noctalia 캘린더에 동기화"
tags = ["Calendar", "Groupware"]
dependencies = ["python3", "libsecret"]

[[setting]]
key = "server_url"
type = "string"
label_key = "settings.server_url.label"
description_key = "settings.server_url.description"
default = ""

[[setting]]
key = "auth_method"
type = "select"
label_key = "settings.auth_method.label"
description_key = "settings.auth_method.description"
default = "password"
options = [
  { value = "password", label_key = "settings.auth_method.password" },
  { value = "browser", label_key = "settings.auth_method.browser" },
]

[[setting]]
key = "login_id"
type = "string"
label_key = "settings.login_id.label"
description_key = "settings.login_id.description"
default = ""
visible_when = { key = "auth_method", values = ["password"] }

[[setting]]
key = "browser"
type = "select"
label_key = "settings.browser.label"
description_key = "settings.browser.description"
default = "chrome"
options = [
  { value = "chrome", label_key = "settings.browser.chrome" },
  { value = "chromium", label_key = "settings.browser.chromium" },
  { value = "firefox", label_key = "settings.browser.firefox" },
]
visible_when = { key = "auth_method", values = ["browser"] }

[[setting]]
key = "browser_profile"
type = "string"
label_key = "settings.browser_profile.label"
description_key = "settings.browser_profile.description"
default = ""
advanced = true
visible_when = { key = "auth_method", values = ["browser"] }

[[setting]]
key = "only_mine"
type = "bool"
label_key = "settings.only_mine.label"
description_key = "settings.only_mine.description"
default = true

[[setting]]
key = "refresh_minutes"
type = "int"
label_key = "settings.refresh_minutes.label"
description_key = "settings.refresh_minutes.description"
default = 15
min = 5
max = 1440

[[setting]]
key = "past_days"
type = "int"
label_key = "settings.past_days.label"
description_key = "settings.past_days.description"
default = 14
min = 0
max = 365

[[setting]]
key = "future_days"
type = "int"
label_key = "settings.future_days.label"
description_key = "settings.future_days.description"
default = 60
min = 1
max = 365

[[setting]]
key = "server_utc_offset"
type = "int"
label_key = "settings.server_utc_offset.label"
description_key = "settings.server_utc_offset.description"
default = 9
min = -12
max = 14
advanced = true

[[setting]]
key = "vdir_path"
type = "folder"
label_key = "settings.vdir_path.label"
description_key = "settings.vdir_path.description"
default = "~/.local/share/calendars/amaranth"
advanced = true

[[service]]
id = "sync"
entry = "service.luau"
